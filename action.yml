name: Setup Elevon
description: Setup Elevon and deploy applications with it
author: "Erqon"
branding:
  icon: "box"
  color: "yellow"

inputs:
  version:
    description: Elevon version
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Install Elevon Deploy
      shell: bash
      run: install.sh "${{ inputs.version }}"
